<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Tester</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #messages { margin-top: 20px; border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; }
    .message { margin-bottom: 10px; }
  </style>
</head>
<body>

  <h2>Socket.IO Chat Test</h2>

  <label>Your UPI:</label>
  <input type="text" id="from" placeholder="9876543210@gradious"><br><br>

  <label>Recipient UPI:</label>
  <input type="text" id="to" placeholder="9876543211@gradious"><br><br>

  <label>Message:</label>
  <input type="text" id="message" placeholder="Hi there"><br><br>

  <label>Payment Intent?</label>
  <input type="checkbox" id="isPaymentIntent"><br><br>

  <label>Amount (if payment):</label>
  <input type="number" id="amount" placeholder="0"><br><br>

  <button onclick="sendMessage()">Send</button>

  <div id="messages"></div>

  <script>
    const socket = io("http://localhost:5000");

    socket.on("connect", () => {
      console.log("🟢 Connected to server");
    });

    socket.on("receiveMessage", (data) => {
      const msgDiv = document.createElement("div");
      msgDiv.classList.add("message");
      msgDiv.innerText = `[${data.from} ➡ ${data.to}] ${data.message}` + 
                         (data.isPaymentIntent ? ` 💰 Rs.${data.amount}` : "");
      document.getElementById("messages").appendChild(msgDiv);
    });

    function sendMessage() {
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const message = document.getElementById("message").value;
      const isPaymentIntent = document.getElementById("isPaymentIntent").checked;
      const amount = parseFloat(document.getElementById("amount").value) || 0;

      const payload = { from, to, message, isPaymentIntent, amount };
      socket.emit("sendMessage", payload);
    }
  </script>

</body>
</html>
