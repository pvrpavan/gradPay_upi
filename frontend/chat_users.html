<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/x-icon" href="photos\gradious-pay-logo-final.png">
    <title>Gradious Pay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="chat-glass-wrapper">
        <div class="chat-header">
            <a class="back-btn" onclick="history.back()">
                <i class="fas fa-arrow-left icon-btn" style="color: white;" onclick="navigateTo('index.html')"></i>
            </a>
            <span class="chat-username">John Doe</span>
        </div>

        <div class="chat-glass" id="chatBox">
            <div class="message left">Hi! Did you receive the amount?</div>
            <div class="message right">Yes, thanks a lot 😊</div>
        </div>

        <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="Type a message..." />
            <button class="floating-send" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
