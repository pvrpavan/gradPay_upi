<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png/x-icon" href="photos\gradious-pay-logo-final.png">
  <title>Gradious Pay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="mobile-container">
    <header class="top-bar">
      <div onclick="navigateTo('profile_page.html')">
        <img src="photos\user-profile-photo.png" alt="User Profile Photo" class="user-profile-photo">
      </div>
      <i class="fas fa-question-circle help-icon" onclick="navigateTo('faqs_page.html')"></i>
    </header>

    <main class="home-main">
      <div class="top-banner">
        <img src="photos\index_photo_no_bg.png" alt="GradiousPay Logo" class="index-photo">
      </div>
      <section class="quick-actions">
        <div class="action-card" onclick="navigateTo('transaction_to_other_accounts.html')">
          <i class="fas fa-paper-plane"></i>
          <span>Send Money</span>
        </div>
        <div class="action-card" onclick="navigateTo('deposit.html')">
          <i class="fas fa-arrow-circle-down"></i>
          <span>Deposit</span>
        </div>
        <div class="action-card" onclick="navigateTo('account-balance.html')">
          <i class="fas fa-wallet"></i>
          <span>Balance</span>
        </div>
      </section>

      <section class="utilities">
        <h3>Utilities</h3>
        <div class="utility-grid">
          <div class="utility-item">Electricity</div>
          <div class="utility-item">Travel</div>
          <div class="utility-item">Recharge</div>
          <div class="utility-item">Water</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="navigateTo('index.html')">
        <i class="fas fa-home"></i><span>Home</span>
      </div>
      <div class="nav-item" onclick="navigateTo('scanner_page.html')">
        <i class="fas fa-qrcode"></i><span>Scanner</span>
      </div>
      <div class="nav-item" onclick="navigateTo('expense_tracker.html')">
        <i class="fas fa-chart-line"></i><span>Tracker</span>
      </div>
      <div class="nav-item" onclick="navigateTo('transaction_history.html')">
        <i class="fas fa-receipt"></i><span>History</span>
      </div>

    </nav>
  </div>


  <script src="script.js"></script>
</body>

</html>
