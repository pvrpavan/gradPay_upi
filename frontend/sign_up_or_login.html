<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/x-icon" href="photos\gradious-pay-logo-final.png">
    <title>Gradious Pay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

<body data-page="sign_up_or_login">
    <div class="get-started-main-div">
        <div class="container">
            <div class="brand-logo-cont">

                <img src="photos\gradious-pay-logo-final.png" class="gradPay_logo">

                <h1><span class="brand-name-span">Gradious </span>Pay</h1>

            </div>

            <div class="register-section">

                <h1 class="soul-name">Register</h1>


                <div class="otp-section" id="otpSection">
                    <a class="go-back-button" onclick="navigateTo('get_started.html')"> <i
                            class="fa-solid fa-arrow-left"></i></a>

                    <input id="phoneNumber" type="tel" maxlength="10" placeholder="Enter your phone number" />

                    <a class="send-otp-button" id="sendOtpBtn">Send OTP</a>

                    <div class="otp-inputs">
                        <input type="text" maxlength="1" class="otp-box" />
                        <input type="text" maxlength="1" class="otp-box" />
                        <input type="text" maxlength="1" class="otp-box" />
                        <input type="text" maxlength="1" class="otp-box" />
                        <input type="text" maxlength="1" class="otp-box" />
                        <input type="text" maxlength="1" class="otp-box" />

                    </div>

                    <button id="verifyOtpBtn">Verify OTP</button>
                    <!-- <p id="resendBtn">Resend OTP in <span id="countdown">30</span>s</p> -->

                    <p id="message"></p>
                    <!-- <p id="timerText">Resend OTP in <span id="countdown">30</span>s</p> -->
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.1.1/build/js/intlTelInput.min.js"></script>
    <script src="script.js"></script>
