<!DOCTYPE html>
<html lang="en">

<body>
<div class="mobile-container">
    <header class="top-bar">
      <i class="fas fa-arrow-left" onclick="navigateTo('index.html')"></i>
      <h3>Expense Tracker</h3>
      <div></div>
    </header>

    <main class="tracker-area">
      <div class="expense-entry">

      <ul class="expense-list" id="expenseList">
        
      </ul>

      <h4>Expense Breakdown</h4>
      <!-- <canvas id="expenseChart" width="300" height="300"></canvas> -->

      <img src="photos/expense_tracker_photo.png" alt="Expense Tracker" class="tracker-photo">
    </main>


    <nav class="bottom-nav">
      <div class="nav-item " onclick="navigateTo('index.html')">
        <i class="fas fa-home"></i><span>Home</span>

        <i class="fas fa-qrcode"></i><span>Scanner</span>
      </div>
      <div class="nav-item active" onclick="navigateTo('expense_tracker.html')">
        <i class="fas fa-chart-line"></i><span>Tracker</span>
      </div>
      <div class="nav-item" onclick="navigateTo('transaction_history.html')">

      </div>

  </div>
