<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png/x-icon" href="photos\gradious-pay-logo-final.png">
    <title>Gradious Pay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">

</head>

<body class="no-scroll">


    <div class="register-wrapper">
        <h1 style="text-align: center;" class="creating-account-heading">
            Seems like you're new <br>
            to us!!
        </h1>
        <div class="register-card">
            <h2>Create your gradPay Account</h2>
            <form id="registerForm">
                <input type="text" id="displayName" placeholder="Display Name" required />
                <input type="email" id="email" placeholder="Email (Optional)" />
                <input type="password" id="password" placeholder="Password" required />
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
                <button type="submit" class="orange-btn">Register</button>
            </form>
        </div>
    </div>




    <script src="script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("registerForm");

            // Extract phone number from URL query param
            const urlParams = new URLSearchParams(window.location.search);
            const phone = urlParams.get("phone");
            console.log(phone);

            if (!phone) {
                alert("Phone number missing. Please login again.");
                window.location.href = "index.html";
                return;
            }


            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const displayName = document.getElementById("displayName").value;
                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const phone = new URLSearchParams(window.location.search).get("phone");

                if (password !== confirmPassword) {
                    alert("Passwords do not match.");
                    return;
                }

                const payload = {
                    displayName,
                    email,
                    password,
                    phone,
                };

                const res = await fetch("http://localhost:5000/api/auth/create-account", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                
                console.log(res);
                if (res.status === 400) {
                    alert("User already exists. Try logging in.");
                } else if (res.ok) {
                    const data = await res.json();
                    alert("Account created successfully!");
                    window.location.href = `profile_page.html?phone=${phone}`;
                } else {
                   
                    alert( "Account creation failed.");
                }
            });

        });


    </script>

</body>

</html>
