    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QR Scanner - Gradious Pay</title>
        <link rel="stylesheet" href="style.css" />

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    </head>

    <body>
        <div class="mobile-wrapper">
            <header class="top-bar">
                <h2>QR Scanner</h2>
            </header>

            <main class="scanner-main">
                <video id="video" muted autoplay playsinline></video>
                <p id="scan-result">Looking for QR code...</p>
            </main>

            <nav class="bottom-nav">
                <div class="nav-item" onclick="navigateTo('index.html')">
                    <i class="fas fa-home"></i><span>Home</span>
                </div>
                <div class="nav-item active" onclick="navigateTo('scanner_page.html')">
                    <i class="fas fa-qrcode active"></i><span>Scanner</span>
                </div>
                <div class="nav-item" onclick="navigateTo('expense_tracker.html')">
                    <i class="fas fa-chart-line"></i><span>track</span>
                </div>
                <div class="nav-item" onclick="navigateTo('transaction_history.html')">
                    <i class="fas fa-receipt"></i><span>History</span>
                </div>
            </nav>
        </div>
    </body>

    </html>




    <script src="https://unpkg.com/qr-scanner/qr-scanner.min.js"></script>

    <script src="script.js"></script>
